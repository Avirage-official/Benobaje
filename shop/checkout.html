<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Tyco</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230b0b0c'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-weight='700' font-size='36' fill='%23cfff3d' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shop.css">
</head>
<body class="tyco">

  <div class="tyco-container">
    <div class="tyco-bar">
      <a class="tyco-wordmark" href="index.html">TYCO<span>.</span></a>
      <span class="tyco-bar-note">Secure checkout</span>
    </div>

    <div class="tyco-checkout">
      <div>
        <a class="tyco-back" href="index.html">← Back to shop</a>
        <div class="tyco-ticket" id="tyco-ticket"></div>
      </div>

      <div class="tyco-form">
        <h2>Shipping details</h2>
        <form id="tyco-checkout-form" novalidate>
          <div class="tyco-field-grid">
            <div class="tyco-field">
              <label for="firstName">First name</label>
              <input type="text" id="firstName" name="firstName" required>
            </div>
            <div class="tyco-field">
              <label for="lastName">Last name</label>
              <input type="text" id="lastName" name="lastName" required>
            </div>
          </div>

          <div class="tyco-field-grid">
            <div class="tyco-field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="tyco-field">
              <label for="phone">Phone</label>
              <input type="tel" id="phone" name="phone" required>
            </div>
          </div>

          <div class="tyco-field">
            <label for="address1">Address</label>
            <input type="text" id="address1" name="address1" required>
          </div>
          <div class="tyco-field">
            <label for="address2">Apartment, suite, etc. (optional)</label>
            <input type="text" id="address2" name="address2">
          </div>

          <div class="tyco-field-grid">
            <div class="tyco-field">
              <label for="city">City</label>
              <input type="text" id="city" name="city" required>
            </div>
            <div class="tyco-field">
              <label for="region">State / Region</label>
              <input type="text" id="region" name="region" required>
            </div>
          </div>

          <div class="tyco-field-grid">
            <div class="tyco-field">
              <label for="postcode">Postcode</label>
              <input type="text" id="postcode" name="postcode" required>
            </div>
            <div class="tyco-field">
              <label for="countryCode">Country</label>
              <select id="countryCode" name="countryCode" required></select>
            </div>
          </div>

          <hr class="tyco-divider">

          <div id="tyco-pay-mount" class="tyco-pay-mount"></div>
          <div id="tyco-error" class="tyco-error"></div>

          <button type="submit" id="tyco-submit" class="tyco-submit">Continue to payment</button>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/checkout.js"></script>
</body>
</html>
