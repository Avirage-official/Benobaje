<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Tyco</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230b0b0c'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-weight='700' font-size='36' fill='%23cfff3d' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shop.css">
</head>
<body class="tyco">

  <div class="tyco-container">
    <div class="tyco-bar">
      <a class="tyco-wordmark" href="index.html">TYCO<span>.</span></a>
      <span class="tyco-bar-note">Order confirmed</span>
    </div>

    <section class="tyco-confirm">
      <span class="tyco-confirm-badge">Payment received</span>
      <h1>You're in.</h1>
      <p id="tyco-ref" class="tyco-confirm-ref">Order —</p>

      <div class="tyco-steps">
        <div class="tyco-step" id="step-paid">
          <span class="tyco-step-dot"></span>
          <span class="tyco-step-label">Paid</span>
        </div>
        <div class="tyco-step" id="step-fulfil">
          <span class="tyco-step-dot"></span>
          <span class="tyco-step-label">Sent to fulfilment</span>
        </div>
        <div class="tyco-step" id="step-shipped">
          <span class="tyco-step-dot"></span>
          <span class="tyco-step-label">Shipped</span>
        </div>
      </div>

      <p id="tyco-tracking" class="tyco-tracking"></p>

      <p style="margin-top: 2rem;"><a href="index.html" style="color: var(--tyco-accent);">← Back to shop</a></p>
    </section>
  </div>

  <script src="../js/order-status.js"></script>
</body>
</html>
